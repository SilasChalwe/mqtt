<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validation Dashboard</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f3f4f6; color: #111827; }
    .app-shell { max-width: 1120px; margin: 0 auto; padding: 24px; }
    .panel { background: #ffffff; border-radius: 22px; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08); padding: 28px; margin-bottom: 18px; }
    h1 { margin: 0 0 8px; font-size: 2.0rem; letter-spacing: -0.03em; }
    p.lead { margin: 0 0 20px; color: #4b5563; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.95rem; color: #374151; }
    .field input { border: 1px solid #d1d5db; border-radius: 14px; padding: 12px 14px; font-size: 0.98rem; color: #111827; background: #f9fafb; }
    .field input:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .button { border: none; border-radius: 14px; padding: 14px 20px; font-size: 0.95rem; cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .button.primary { background: #4f46e5; color: white; box-shadow: 0 12px 24px rgba(79, 70, 229, 0.18); }
    .button.secondary { background: #e5e7eb; color: #111827; }
    .button:hover { transform: translateY(-1px); }
    .status { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-top: 22px; }
    .status-card { background: #eef2ff; padding: 18px 20px; border-radius: 18px; }
    .status-card strong { display: block; margin-bottom: 8px; color: #4338ca; }
    .log { background: #111827; border-radius: 18px; color: #f9fafb; padding: 18px; min-height: 140px; white-space: pre-wrap; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace; }
    .small { font-size: 0.8rem; color: #6b7280; }
    .chart-row { display: grid; gap: 18px; margin-top: 22px; }
    .chart-card { padding: 18px; border-radius: 18px; background: #fafafa; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8); }
    canvas { width: 100% !important; height: 420px !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="panel">
      <h1>Validation Dashboard</h1>
      <div class="grid">
        <div class="field"><label for="samples">Samples</label><input id="samples" value="500"></div>
        <div class="field"><label for="start_time">Start Time</label><input id="start_time" value="2026-07-12T07:59:00"></div>
        <div class="field"><label for="end_time">End Time</label><input id="end_time" value="2026-07-26T23:59:00"></div>
      </div>
      <label class="small"><input type="checkbox" id="cleanup" checked> Cleanup intermediate files</label>
      <div class="actions">
        <button class="button primary" id="run-single">Run Single Simulation</button>
      </div>
    </section>
    <section class="panel">
      <div class="status">
        <div class="status-card"><strong>Status</strong><span id="status-text">Ready</span></div>
      </div>
      <div class="chart-row">
        <div class="chart-card"><canvas id="combinedChart"></canvas></div>
      </div>
      <div class="log" id="log-output">Waiting for action...</div>
    </section>
  </main>
  <script>
    const log = document.getElementById('log-output');
    const statusText = document.getElementById('status-text');
    let combinedChart = null;

    function appendLog(message){
      log.textContent += `\n${new Date().toLocaleTimeString()} - ${message}`;
      log.scrollTop = log.scrollHeight;
    }

    function formatLabels(times){
      return times.map(t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    }

    function renderChart(chartData){
      const startTime = new Date(document.getElementById('start_time').value).getTime();
      const endTime = new Date(document.getElementById('end_time').value).getTime();
      
      // Filter data to only include times within the user's range
      const managedFiltered = filterByTimeRange(chartData.managed, startTime, endTime);
      const unmanagedFiltered = filterByTimeRange(chartData.unmanaged, startTime, endTime);
      
      const labels = formatLabels(managedFiltered.time);
      const datasets = [
        { label: 'Voltage (managed)', data: managedFiltered.voltage, borderColor: '#4338ca', backgroundColor: 'rgba(67,56,202,0.18)', yAxisID: 'yVoltage', tension: 0.26, fill: false, pointRadius: 0 },
        { label: 'Voltage (unmanaged)', data: unmanagedFiltered.voltage, borderColor: '#c7d2fe', backgroundColor: 'rgba(199,210,254,0.18)', yAxisID: 'yVoltage', tension: 0.26, fill: false, borderDash: [6, 4], pointRadius: 0 },
        { label: 'SoC (managed)', data: managedFiltered.soc, borderColor: '#0f766e', backgroundColor: 'rgba(15,118,110,0.18)', yAxisID: 'ySoc', tension: 0.26, fill: false, pointRadius: 0 },
        { label: 'SoC (unmanaged)', data: unmanagedFiltered.soc, borderColor: '#5eead4', backgroundColor: 'rgba(94,234,212,0.18)', yAxisID: 'ySoc', tension: 0.26, fill: false, borderDash: [6, 4], pointRadius: 0 },
        { label: 'Solar Current (managed)', data: managedFiltered.solar_current, borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.18)', yAxisID: 'yCurrent', tension: 0.26, fill: false, pointRadius: 0 },
        { label: 'Solar Current (unmanaged)', data: unmanagedFiltered.solar_current, borderColor: '#fdba74', backgroundColor: 'rgba(253,186,116,0.18)', yAxisID: 'yCurrent', tension: 0.26, fill: false, borderDash: [6, 4], pointRadius: 0 },
        { label: 'Solar Power (managed)', data: managedFiltered.solar_power, borderColor: '#b45309', backgroundColor: 'rgba(180,83,9,0.18)', yAxisID: 'yPower', tension: 0.26, fill: false, pointRadius: 0 },
        { label: 'Solar Power (unmanaged)', data: unmanagedFiltered.solar_power, borderColor: '#facc15', backgroundColor: 'rgba(250,204,21,0.18)', yAxisID: 'yPower', tension: 0.26, fill: false, borderDash: [6, 4], pointRadius: 0 },
      ];
      const ctx = document.getElementById('combinedChart').getContext('2d');
      if(combinedChart){ combinedChart.destroy(); }
      combinedChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: true },
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, boxHeight: 12 } },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const label = context.dataset.label || '';
                  const value = context.parsed.y.toFixed(2);
                  return label + ': ' + value;
                },
                afterLabel: function(context) {
                  return '';
                }
              }
            }
          },
          scales: {
            x: { display: true, title: { display: true, text: 'Time' } },
            yVoltage: { type: 'linear', position: 'left', display: true, title: { display: true, text: 'Voltage (V)' }, grid: { drawOnChartArea: false } },
            ySoc: { type: 'linear', position: 'right', display: true, title: { display: true, text: 'SoC (%)' }, grid: { drawOnChartArea: false }, min: 0, max: 100 },
            yCurrent: { type: 'linear', position: 'right', display: true, title: { display: true, text: 'Solar Current (A)' }, grid: { drawOnChartArea: false }, offset: true },
            yPower: { type: 'linear', position: 'left', display: true, title: { display: true, text: 'Solar Power (W)' }, grid: { drawOnChartArea: false }, offset: true },
          }
        }
      });
    }
    
    function filterByTimeRange(data, startTime, endTime) {
      const indices = [];
      for (let i = 0; i < data.time.length; i++) {
        const t = new Date(data.time[i]).getTime();
        if (t >= startTime && t <= endTime) {
          indices.push(i);
        }
      }
      return {
        time: indices.map(i => data.time[i]),
        voltage: indices.map(i => data.voltage[i]),
        soc: indices.map(i => data.soc[i]),
        solar_current: indices.map(i => data.solar_current[i]),
        solar_power: indices.map(i => data.solar_power[i]),
      };
    }

    async function postJson(path, payload){
      statusText.textContent = 'Working...';
      appendLog(`Sending request: ${path}`);
      const resp = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if(!data.success){ throw new Error(data.error || 'Unknown server error'); }
      appendLog(data.message);
      statusText.textContent = 'Ready';
      return data;
    }

    document.getElementById('run-single').addEventListener('click', async () => {
      try {
        const payload = {
          samples: document.getElementById('samples').value,
          start_time: document.getElementById('start_time').value,
          end_time: document.getElementById('end_time').value,
          cleanup: document.getElementById('cleanup').checked,
        };
        const result = await postJson('/api/run-single', payload);
        appendLog(`Plot written: ${result.plot}`);
        renderChart(result.chart_data);
      } catch (err) {
        appendLog(`Error: ${err.message}`);
        statusText.textContent = 'Error';
      }
    });
  </script>
</body>
</html>
